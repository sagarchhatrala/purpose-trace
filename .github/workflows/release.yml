name: Build release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install build
      - run: python -m build
      - name: Exercise the release wheel
        run: |
          python -m venv /tmp/purpose-release
          /tmp/purpose-release/bin/pip install --no-deps dist/*.whl
          /tmp/purpose-release/bin/purpose-trace run --policy examples/policy.json --manifest examples/manifest.json --output /tmp/purpose-release-campaign -- /tmp/purpose-release/bin/python examples/private_router.py
      - uses: actions/upload-artifact@v4
        with:
          name: purpose-trace-release
          path: dist/*
          retention-days: 30
